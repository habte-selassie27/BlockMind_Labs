[project]
name = "blockmind-intent-service"
version = "0.1.0"
requires-python = ">=3.12"
private = true

[project.scripts]
dev = "uvicorn src.main:app --reload --port 8001"
test = "pytest"
test-coverage = "pytest --cov=src --cov-report=term-missing"

[project.dependencies]
fastapi = ">=0.110.0"
uvicorn = {version = ">=0.27.0", extras = ["standard"]}
pydantic = ">=2.0.0"
httpx = ">=0.27.0"
redis = ">=5.0.0"
langdetect = ">=1.0.9"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
