[package]
name = "wallet-signer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.11", features = ["json"] }
